name: Desafio 1 Github actions

on:
  workflow_dispatch:
    inputs:
      validaImagemDocker:
        description: Validação da imagem
        required: false
        default: 'nginx:latest'
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: login DockerHub
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Busca imagem docker
        run: docker pull ${{ validaImagemDocker }}
      
      - name: Leitura da imagem
        run: | 
          IMAGE_NAME=$(echo "${{inputs.validaImagemDocker}}") | cut -d ':' -f 1
          docker images | grep ${{ inputs.validaImagemDocker }}
      
      - name: Scan com Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.validaImagemDocker }}
          only-severities: critical,high
