name: Desafio 1 Github actions

on:
  workflow_dispatch:
    inputs:
      name:
        description: Nome da imagem docker
        required: true
        type: string
      tag:
        description: Tag da imagem docker
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: login DockerHub
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Busca imagem docker
        run: docker pull ${{ inputs.name }}:${{ inputs.tag }}
      
      - name: Listar imagens
        run: docker images
      
      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.name }}:${{ inputs.tag}}
