name: Vendo arquivos compartilhados entre steps

on:
  push:
    branches: main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versão do Ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Hello World!" > /home/ubuntu/mensagem.txt

      - uses: action/upload-artifact@v7
        with:
          name: strigus
          path: /home/ubuntu/mensagem.txt

  job_2:
    runs-on: ubuntu-latest
    steps:
      - uses: action/download-artifact@v8
        with:
          name: strigus
          path: mensagem.txt

      - name: Ver o conteudo do diretorio
        run: ls -lha && ls ./strigus/

      - name: Move o diretório
        run: mv strigus/mensagem.txt . && rm -rf ./strigus

      - name: Ver o conteudo do diretorio
        run: ls -lha

      - name: Acessa arquivo mensagem
        run: cat mensagem.txt
