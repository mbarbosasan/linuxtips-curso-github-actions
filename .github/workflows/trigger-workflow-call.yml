name: Workflow compartilhado

on:
  workflow_call:
    inputs:
      nome_do_curso:
        required: true
        type: string

jobs: 
  fala_o_nome_do_curso:
    runs-on: ubuntu-latest
    steps:
      - name: Informa o nome do curso
        run: echo "O nome do seu curso é ${{inputs.nome_do_curso}}"
