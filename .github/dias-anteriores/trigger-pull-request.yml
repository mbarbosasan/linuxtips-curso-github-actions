name: Criando nosso trigger para Pull Request

on:
  pull_request:
    types: [opened, edited, reopened]
    branches:
      - 'main'
      - 'main*'
      - 'main/**'

jobs:
  job-pull-request:
    runs-on: ubuntu-latest
    steps: 
      - name: Printa Pull Request
        run: echo "Uma Pull Request foi aberta/editada/deletada/reaberto com destino a branch main"
